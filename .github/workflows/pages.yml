name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Any copy of this workflow running outside the production repo (e.g. the
      # site-staging mirror) publishes with a blanket noindex so staging never
      # gets crawled. Production is unaffected: no robots.txt is written there.
      - name: Add noindex robots.txt (staging only)
        if: github.repository != 'techandsociety-ai/techandsociety-ai.github.io'
        run: printf 'User-agent: *\nDisallow: /\n' > docs/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
